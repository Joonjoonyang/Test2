<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 좌석 월별 자동배정</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fb;color:#202733}.wrap{max-width:1100px;margin:auto;padding:24px}.panel,.month-card{background:white;border:1px solid #dfe4ec;border-radius:14px;padding:18px;margin-bottom:18px}.inputs{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:flex;flex-direction:column;gap:6px;font-weight:700}input{width:120px;padding:9px;border:1px solid #ccd3df;border-radius:8px;font-size:16px}button{border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}.primary{background:#222;color:white}.danger{background:#eee;color:#b00020}.hint,.small{font-size:13px;color:#687386}.hint{margin-top:12px}.prompt{padding:14px;background:#eef4ff;border:1px solid #c9dafd;border-radius:12px;margin:14px 0}.month-title{font-size:21px;font-weight:800;margin-bottom:14px}.classroom{display:flex;gap:18px;overflow-x:auto}.block{min-width:120px;width:120px;border:2px solid #cfd7e4;border-radius:12px;padding:10px;background:#fafbfe}.block-title{text-align:center;font-weight:800}.seat{height:48px;border:1px solid #cfd5df;border-radius:8px;background:#fff;margin:7px 0;display:flex;align-items:center;justify-content:center;font-weight:800;position:relative}.seat.dup{border:2px solid #d33;background:#fff3f3}.dupmark{position:absolute;right:5px;top:3px;font-size:10px;color:#c00}.history-table{border-collapse:collapse;width:100%;margin-top:12px}.history-table th,.history-table td{border:1px solid #d7dce5;padding:7px;text-align:center}
</style></head><body><div class="wrap"><div class="panel controls"><h1>학생 좌석 월별 자동배정</h1><div class="inputs"><label>학생 수<input id="n" type="number" min="1" value="30"></label><label>개월 수<input id="m" type="number" min="1" max="12" value="12"></label><label>분단 수<input id="b" type="number" min="1" value="6"></label><button id="start" class="primary">배정 시작</button><button id="reset" class="danger" style="display:none">초기화</button></div><div class="hint">같은 학생의 동일한 (분단 X, 자리 Y) 재배정을 피합니다. 불가피한 중복은 표시합니다.</div></div><div id="app"></div></div>
<script>
(()=>{const KEY="student_seat_monthly_v8";let S={n:0,m:0,b:0,months:[],nextMonth:0,busy:false};const $=id=>document.getElementById(id),app=$("app");
function save(){localStorage.setItem(KEY,JSON.stringify({...S,busy:false}))}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||"null");if(x&&x.n&&x.m&&x.b&&Array.isArray(x.months)){S={...S,...x,busy:false};return true}}catch(e){}return false}
function seats(n,b){let q=Math.floor(n/b),r=n%b,a=[];for(let x=1;x<=b;x++)for(let y=1;y<=q+(x<=r?1:0);y++)a.push({x,y,key:x+"-"+y});return a}
function makeMonth(){let ss=seats(S.n,S.b),used=Array.from({length:S.n},()=>new Set());S.months.forEach(m=>m.assignment.forEach((a,i)=>used[i].add(a.key)));let best,bestDup=1e9;for(let t=0;t<Math.min(3000,Math.max(500,S.n*50));t++){let rem=ss.slice().sort(()=>Math.random()-.5),order=[...Array(S.n).keys()].sort((a,b)=>used[b].size-used[a].size),res=[],dup=0;for(let i of order){let c=rem.filter(z=>!used[i].has(z.key));if(!c.length){c=rem;dup++}let z=c[Math.floor(Math.random()*c.length)];res[i]=z;rem.splice(rem.findIndex(v=>v.key===z.key),1)}if(dup<bestDup){bestDup=dup;best=res}if(!dup)break}return{assignment:best.map((z,i)=>({student:i+1,x:z.x,y:z.y,key:z.key,dup:used[i].has(z.key)})),dupCount:best.filter((z,i)=>used[i].has(z.key)).length}}
function clearPrompt(){document.querySelectorAll(".prompt").forEach(e=>e.remove())}
function prompt(){clearPrompt();if(S.nextMonth>=S.m)return finish();let p=document.createElement("div");p.className="prompt";p.innerHTML="<b>"+(S.nextMonth+1)+"개월차 좌석을 선정할 준비가 되었습니다.</b><br><span class='small'>Space 또는 Enter를 누르면 5그룹이 3초 간격으로 공개됩니다.</span>";app.appendChild(p)}
function card(mi,data,all){let c=document.createElement("div");c.className="month-card";c.innerHTML="<div class='month-title'>"+(mi+1)+"개월차</div>";let room=document.createElement("div");room.className="classroom";let ss=seats(S.n,S.b);for(let x=1;x<=S.b;x++){let bl=document.createElement("div");bl.className="block";bl.innerHTML="<div class='block-title'>"+x+"분단</div>";ss.filter(z=>z.x===x).forEach(z=>{let a=data.assignment.find(v=>v.key===z.key),e=document.createElement("div");e.className="seat"+(a.dup?" dup":"");e.dataset.student=a.student;e.style.visibility=all?"visible":"hidden";e.textContent="학생 "+a.student;if(a.dup){let d=document.createElement("span");d.className="dupmark";d.textContent="중복";e.appendChild(d)}bl.appendChild(e)});room.appendChild(bl)}c.appendChild(room);let info=document.createElement("div");info.className="small";info.textContent="중복 좌석: "+data.dupCount+"건";c.appendChild(info);app.appendChild(c);return c}
function reveal(){if(S.busy||S.nextMonth>=S.m)return;S.busy=true;clearPrompt();let mi=S.nextMonth,data=makeMonth(),c=card(mi,data,false),map=new Map();c.querySelectorAll(".seat").forEach(e=>map.set(Number(e.dataset.student),e));let ids=data.assignment.map(a=>a.student);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}let groups=Array.from({length:5},()=>[]);ids.forEach((id,i)=>groups[i%5].push(id));let g=0;function show(){groups[g].forEach(id=>{let e=map.get(id);if(e)e.style.visibility="visible"});g++;if(g<5)setTimeout(show,3000);else{S.months.push(data);S.nextMonth++;S.busy=false;save();S.nextMonth<S.m?prompt():finish()}}show()}
function render(){app.innerHTML="";$("start").style.display="none";$("reset").style.display="inline-block";S.months.forEach((m,i)=>card(i,m,true));S.nextMonth<S.m?prompt():finish()}
function finish(){if(document.getElementById("finish"))return;let p=document.createElement("div");p.id="finish";p.className="panel";p.innerHTML="<b>모든 월의 좌석 선정이 완료되었습니다.</b> <button id='hist' class='primary'>학생별 이력</button> <button id='print'>인쇄</button><div id='hb'></div>";app.appendChild(p);$("hist").onclick=history;$("print").onclick=()=>print()}
function history(){let b=$("hb");if(b.innerHTML){b.innerHTML="";return}let h="<table class='history-table'><tr><th>학생</th>";for(let m=0;m<S.m;m++)h+="<th>"+(m+1)+"개월</th>";h+="</tr>";for(let st=1;st<=S.n;st++){h+="<tr><th>"+st+"</th>";for(let m=0;m<S.months.length;m++){let a=S.months[m].assignment.find(x=>x.student===st);h+="<td>"+(a?"("+a.x+", "+a.y+")"+(a.dup?" *":""):"-")+"</td>"}h+="</tr>"}b.innerHTML=h+"</table><div class='small'>* 중복</div>"}
$("start").onclick=()=>{let n=+$("n").value,m=+$("m").value,b=+$("b").value;if(!Number.isInteger(n)||n<1||!Number.isInteger(m)||m<1||m>12||!Number.isInteger(b)||b<1||b>n){alert("입력값을 확인해 주세요.");return}S={n,m,b,months:[],nextMonth:0,busy:false};save();$("start").style.display="none";$("reset").style.display="inline-block";app.innerHTML="";prompt()};
$("reset").onclick=()=>{if(confirm("저장된 내용을 모두 초기화할까요?")){localStorage.removeItem(KEY);location.reload()}};
document.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!S.busy&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)&&S.n&&S.nextMonth<S.m){e.preventDefault();reveal()}});
if(load()){$("n").value=S.n;$("m").value=S.m;$("b").value=S.b;render()}
})();
</script></body></html>
